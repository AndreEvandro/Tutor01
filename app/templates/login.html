<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Tutor Socrático IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4 style="max-width: 400px; width: 100%;">
        <h3 class="text-center text-primary fw-bold mb-3">Tutor Socrático</h3>
        <p class="text-center text-muted small">Acesse com uma das contas de teste</p>
        
        {% if error %}
        <div class="alert alert-danger p-2 small text-center">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" placeholder="admin@tutor.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" placeholder="******" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <hr>
        <div class="small text-muted">
            <strong>Contas de Teste:</strong><br>
            • Admin: <code>admin@tutor.com</code> | <code>admin123</code><br>
            • Docente: <code>docente@tutor.com</code> | <code>docente123</code><br>
            • Estudante: <code>aluno@tutor.com</code> | <code>aluno123</code>
        </div>
    </div>
</body>
</html>
