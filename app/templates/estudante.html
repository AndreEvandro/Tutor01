<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Estudante - Tutor Socrático</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #chat-box { height: 380px; overflow-y: auto; background-color: #f8f9fa; }
        .msg-student { background-color: #0d6efd; color: white; align-self: flex-end; max-width: 75%; }
        .msg-tutor { background-color: #e9ecef; color: #212529; align-self: flex-start; max-width: 75%; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-info px-4 shadow-sm">
        <span class="navbar-brand fw-bold text-dark">Tutor Socrático IA</span>
        <div>
            <span class="text-dark me-3">Estudante: <strong>{{ user_name }}</strong></span>
            <a href="/logout" class="btn btn-outline-dark btn-sm">Sair</a>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 800px;">
        <div class="card shadow-sm mb-3">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-primary">Atividade: Introdução ao Raciocínio Lógico</h5>
                <span class="badge bg-secondary" id="badge-level">Nível de Ajuda: 1 (Questionamento)</span>
            </div>
            
            <div class="card-body d-flex flex-column p-3" id="chat-box">
                <div class="p-3 rounded mb-2 msg-tutor">
                    <strong>Tutor Socrático:</strong><br>
                    Olá! Qual dúvida ou problema você gostaria de trabalhar hoje?
                </div>
            </div>

            <div class="card-footer bg-white">
                <form id="chat-form" class="d-flex gap-2">
                    <input type="text" id="user-input" class="form-control" placeholder="Escreva sua tentativa ou pergunta..." required>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                    <button type="button" id="btn-hint" class="btn btn-warning text-dark text-nowrap">💡 Pedir Pista</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const btnHint = document.getElementById('btn-hint');
        const badgeLevel = document.getElementById('badge-level');

        function appendMessage(sender, text, isStudent) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `p-3 rounded mb-2 ${isStudent ? 'msg-student' : 'msg-tutor'}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong><br>${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(message) {
            appendMessage('Você', message, true);
            userInput.value = '';

            const response = await fetch('/student/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'json/application', 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, current_level: currentLevel })
            });

            if (response.ok) {
                const data = await response.json();
                appendMessage('Tutor Socrático', data.response, false);
                badgeLevel.innerText = `Nível de Ajuda: ${data.level} (${data.level_name})`;
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (userInput.value.trim()) sendMessage(userInput.value.trim());
        });

        btnHint.addEventListener('click', () => {
            if (currentLevel < 5) currentLevel++;
            sendMessage(`[Solicitou ajuda adicional - Avançando para Nível ${currentLevel}]`);
        });
    </script>
</body>
</html>
